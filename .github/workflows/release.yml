name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup Deno ──────────────────────────────────────────────────────
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"

      # ── 3. Cache Deno dependencies ─────────────────────────────────────────
      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock') }}
          restore-keys: deno-

      # ── 4. Determine channel & version ────────────────────────────────────
      - name: Determine channel
        id: channel
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          BASE_VERSION="${VERSION%%-*}"
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* || "$TAG" == *"-rc"* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "channel=Beta" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "channel=Release" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VERSION" >> $GITHUB_OUTPUT

      # ── 5. Extract CHANGELOG section for this tag ─────────────────────────
      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.channel.outputs.version }}"
          # Extract section between ## [VERSION] and next ## [
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="No changelog entry found for ${VERSION}."
          fi
          # Write to file to avoid multiline issues with GITHUB_OUTPUT
          echo "$BODY" > release_body.md
          echo "file=release_body.md" >> $GITHUB_OUTPUT

      # ── 6. Patch config.json version from git tag ─────────────────────────
      - name: Patch config.json version
        run: |
          BASE="${{ steps.channel.outputs.base_version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app/packs/config.json','utf8'));
            cfg.meta.version = [${MAJOR}, ${MINOR}, ${PATCH}];
            fs.writeFileSync('app/packs/config.json', JSON.stringify(cfg, null, 2));
            console.log('Patched version to', cfg.meta.version);
          "

      # ── 7. Build ───────────────────────────────────────────────────────────
      - name: Build
        run: deno run build

      # ── 8. Pack to .mcaddon ────────────────────────────────────────────────
      - name: Pack
        run: echo "n" | deno run packs

      # ── 9. Rename artifacts with tag ──────────────────────────────────────
      - name: Rename artifacts
        run: |
          TAG="${{ github.ref_name }}"
          DIST="app/data/dist/addons"
          for f in "$DIST"/*.mcaddon "$DIST"/*.zip; do
            [ -e "$f" ] || continue
            BASE=$(basename "$f")
            EXT="${BASE##*.}"
            NAME="${BASE%.*}"
            mv "$f" "$DIST/${NAME}_${TAG}.${EXT}"
          done
          ls -lh "$DIST"

      # ── 10. Create GitHub Release ──────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.channel.outputs.version }} ${{ steps.channel.outputs.channel }}"
          prerelease: ${{ steps.channel.outputs.is_prerelease }}
          body_path: release_body.md
          files: |
            app/data/dist/addons/*.mcaddon
            app/data/dist/addons/*.zip
